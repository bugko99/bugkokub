services:
  # ─────────────────────────────────────────
  # Backend: Node.js + Express
  # ─────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: docconverter_backend
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV}
      PORT: ${BACKEND_PORT}
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "${BACKEND_PORT}:5001"
    volumes:
      - ./backend:/app
      - /app/node_modules
      - ./backend/uploads:/app/uploads
      - ./backend/converted:/app/converted
    networks:
      - docconverter_net

  # ─────────────────────────────────────────
  # Frontend: React + Vite
  # ─────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: docconverter_frontend
    restart: unless-stopped
    environment:
      VITE_API_URL: ${VITE_API_URL}
    ports:
      - "${FRONTEND_PORT}:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - docconverter_net

# ─────────────────────────────────────────
# Networks
# ─────────────────────────────────────────
networks:
  docconverter_net:
    driver: bridge
